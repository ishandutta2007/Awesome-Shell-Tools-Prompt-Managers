<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399; #38bdf8; #818cf8; #34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#374151" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }

    .pulse-glow-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 300px 180px;
    }
    
    .pulse-glow-2 {
      animation: pulseGlow 7s ease-in-out infinite reverse;
      transform-origin: 900px 240px;
    }

    .cursor {
      animation: blinkCursor 1s infinite;
    }

    .pill-float-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 4.5s ease-in-out infinite; }
    .pill-float-3 { animation: floatPill1 5s ease-in-out infinite 0.5s; }
    .pill-float-4 { animation: floatPill2 4.2s ease-in-out infinite 0.8s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Glows (strictly behind content) -->
  <circle cx="280" cy="160" r="140" fill="#38bdf8" filter="url(#blur-glow)" class="pulse-glow-1" />
  <circle cx="920" cy="220" r="160" fill="#818cf8" filter="url(#blur-glow)" class="pulse-glow-2" />
  <circle cx="600" cy="360" r="130" fill="#34d399" opacity="0.25" filter="url(#blur-glow)" />

  <!-- Subtle Outer Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#374151" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Dynamic Floating Decorative Badges (positioned safely away from center titles) -->
  <g class="pill-float-1">
    <rect x="70" y="45" width="130" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="135" y="65" text-anchor="middle" fill="#38bdf8" font-size="12" class="font-mono" font-weight="600">⚡ &lt; 10ms Cold</text>
  </g>

  <g class="pill-float-2">
    <rect x="990" y="45" width="140" height="30" rx="15" fill="#1e293b" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.6" />
    <text x="1060" y="65" text-anchor="middle" fill="#a78bfa" font-size="12" class="font-mono" font-weight="600">🚀 Cross-Shell</text>
  </g>

  <g class="pill-float-3">
    <rect x="60" y="345" width="150" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
    <text x="135" y="365" text-anchor="middle" fill="#34d399" font-size="12" class="font-mono" font-weight="600">✨ Turbo Plugins</text>
  </g>

  <g class="pill-float-4">
    <rect x="980" y="345" width="150" height="30" rx="15" fill="#1e293b" stroke="#f472b6" stroke-width="1" stroke-opacity="0.6" />
    <text x="1055" y="365" text-anchor="middle" fill="#f472b6" font-size="12" class="font-mono" font-weight="600">🎨 Prompt Theming</text>
  </g>

  <!-- Central Terminal Window (Foreground Card) -->
  <g filter="url(#shadow)">
    <!-- Terminal Box -->
    <rect x="170" y="55" width="860" height="305" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <path d="M 170 67 A 12 12 0 0 1 182 55 L 1018 55 A 12 12 0 0 1 1030 67 L 1030 92 L 170 92 Z" fill="#111827" />
    <line x1="170" y1="92" x2="1030" y2="92" stroke="#374151" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="198" cy="73.5" r="6" fill="#ef4444" />
    <circle cx="218" cy="73.5" r="6" fill="#f59e0b" />
    <circle cx="238" cy="73.5" r="6" fill="#10b981" />

    <!-- Terminal Title -->
    <text x="600" y="78" text-anchor="middle" fill="#9ca3af" font-size="13" class="font-mono">zsh — shell-tools-prompt-managers — 120x34</text>

    <!-- Simulated Prompt Line at Top of Window -->
    <g transform="translate(205, 126)">
      <text x="0" y="0" fill="#38bdf8" font-size="14" class="font-mono" font-weight="bold">~/developer/awesome</text>
      <text x="175" y="0" fill="#9ca3af" font-size="14" class="font-mono">on</text>
      <text x="200" y="0" fill="#a78bfa" font-size="14" class="font-mono" font-weight="bold">git:(main)</text>
      <text x="285" y="0" fill="#34d399" font-size="14" class="font-mono">[✔ ready]</text>
      <text x="365" y="0" fill="#fbbf24" font-size="14" class="font-mono">via 🦀 v1.85</text>
      <text x="475" y="0" fill="#60a5fa" font-size="14" class="font-mono">took 8ms</text>
    </g>

    <!-- MAIN HERO TITLE (High-contrast, foreground, crystal clear) -->
    <g transform="translate(600, 200)">
      <text x="0" y="0" text-anchor="middle" fill="url(#neon-glow)" font-size="34" class="font-sans" font-weight="900" letter-spacing="-0.5">
        Awesome Shell Tools &amp; Prompt Managers
      </text>
    </g>

    <!-- SUBTITLE & MISSION STATEMENT -->
    <g transform="translate(600, 240)">
      <text x="0" y="0" text-anchor="middle" fill="#e5e7eb" font-size="16" class="font-sans" font-weight="500">
        Curated Showcase of Shell Frameworks, Theme Engines &amp; Startup Optimizers
      </text>
      <text x="0" y="24" text-anchor="middle" fill="#9ca3af" font-size="13" class="font-mono">
        Starship • Oh My Zsh • Powerlevel10k • Fish • Oh My Posh • Zinit • Pure
      </text>
    </g>

    <!-- Active Terminal Command & Blinking Cursor -->
    <g transform="translate(340, 318)">
      <rect x="-10" y="-18" width="540" height="28" rx="6" fill="#030712" fill-opacity="0.6" stroke="#1f2937" stroke-width="1" />
      <text x="8" y="2" fill="#10b981" font-size="13" class="font-mono" font-weight="bold">❯</text>
      <text x="26" y="2" fill="#f9fafb" font-size="13" class="font-mono">starship init zsh --print-full-init | source</text>
      <rect x="420" y="-12" width="8" height="16" fill="#38bdf8" class="cursor" />
    </g>
  </g>
</svg>
